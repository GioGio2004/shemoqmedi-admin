# Snippet: add the `render` service to the docker-compose.yml that runs Postiz
# on the VPS (merge it under that file's `services:`). Put the secret in the
# same .env as Postiz:  RENDER_WORKER_KEY=<long random string>
#
# The port is bound to localhost only; the reverse proxy in front of Postiz
# (Caddy / Traefik / nginx) serves it as https://render.shemoqmedi.space.

services:
  render:
    build: ./render-worker # a copy of workers/render from the admin repo
    image: shemoqmedi-render:latest
    restart: unless-stopped
    environment:
      RENDER_WORKER_KEY: ${RENDER_WORKER_KEY:?set RENDER_WORKER_KEY in .env}
      PORT: "8080"
      FFMPEG_THREADS: "2"
      JOB_TIMEOUT_SEC: "300"
      MAX_DOWNLOAD_MB: "200"
      # Only fetch from / upload to our own storage (R2 public bucket + the R2 API host):
      # ALLOWED_HOSTS: "media.shemoqmedi.space,<account-id>.r2.cloudflarestorage.com"
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=1g
    mem_limit: 1g
    cpus: 2
